<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241f1b"><meta name="description" content="全知教会见证处。保存每一份来愿，以及此后的回应。">
  <title>全知教会 · 见证未竟之愿</title>
  <link rel="icon" href="./seal.svg" type="image/svg+xml"><link rel="stylesheet" href="./site.css?v=20261007-photos">
  <script defer src="./records.js?v=20261007"></script><script defer src="./site.js?v=20261007-photos"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至正文</a>
  <header class="masthead">
    <a class="brand" href="./" aria-label="全知教会首页"><img src="./seal.svg" alt="" width="44" height="44"><span>全知教会<small>THE ALL-KNOWING CHURCH</small></span></a>
    <nav aria-label="主导航"><a href="#photos">教会影像</a><a href="#archive">祈愿簿</a></nav>
    <span class="header-note">见证处 · 公开卷</span>
  </header>
  <main id="main">
    <div id="homeView">
      <section class="hero" aria-labelledby="heroTitle">
        <a class="hero-photo" href="./assets/assembly-v2.jpg" data-photo="礼堂集会" aria-label="放大礼堂集会照片"><img src="./assets/assembly-v2.jpg" width="1536" height="1024" alt="木构礼堂内的集会，几位与会者回头看向镜头" fetchpriority="high"></a>
        <div class="hero-copy"><h1 id="heroTitle">凡有所愿，<br>皆有所闻。</h1><a class="primary-link" href="#archive">翻阅祈愿簿 <span>↗</span></a></div>
        <span class="hero-caption">礼堂集会</span>
      </section>
      <section id="photos" class="photos section-wrap" aria-label="教会影像">
        <figure><a href="./assets/registration-v2.jpg" data-photo="祈愿接待" aria-label="放大祈愿接待照片"><img src="./assets/registration-v2.jpg" width="1536" height="1024" alt="三位接待人员坐在桌后，一名来访者递交愿纸" loading="lazy"></a><figcaption>祈愿接待 <span aria-hidden="true">↗</span></figcaption></figure>
        <figure><a href="./assets/archive-v2.jpg" data-photo="档案整理" aria-label="放大档案整理照片"><img src="./assets/archive-v2.jpg" width="1536" height="1024" alt="档案室内，两位工作人员双手放在桌面，身后是纸质卷宗" loading="lazy"></a><figcaption>档案整理 <span aria-hidden="true">↗</span></figcaption></figure>
        <figure><a href="./assets/handover-v2.jpg" data-photo="旧物交接" aria-label="放大旧物交接照片"><img src="./assets/handover-v2.jpg" width="1536" height="1024" alt="三位交接人员站在木匣后合影" loading="lazy"></a><figcaption>旧物交接 <span aria-hidden="true">↗</span></figcaption></figure>
      </section>
      <section id="archive" class="archive section-wrap" aria-labelledby="archiveTitle"><div class="section-heading"><h2 id="archiveTitle">祈愿簿</h2><p>公开摘录</p></div>
        <form id="archiveForm" class="search-form" role="search"><label class="sr-only" for="wishQuery">检索祈愿记录</label><span aria-hidden="true">⌕</span><input id="wishQuery" type="search" maxlength="120" placeholder="输入题名、署名或档案编号" autocomplete="off"><button type="submit">检索 <span aria-hidden="true">↗</span></button></form>
        <div class="archive-controls"><div class="filters"><label>类别 <select id="typeFilter"><option value="">全部</option><option>团圆</option><option>安宁</option><option>留声</option><option>归还</option><option>偿还</option></select></label><label>状态 <select id="statusFilter"><option value="">全部</option><option>持续见证</option><option>已封存</option><option>附页留存</option></select></label></div><p id="resultCount" role="status" aria-live="polite"></p></div>
        <div id="recordList" class="record-list"></div>
        <noscript><p>请启用 JavaScript 以翻阅祈愿簿。</p></noscript>
        <div id="readingHistory" class="reading-history" hidden><h3>本机阅览</h3><div id="historyList"></div></div>
        <p id="storageStatus" class="storage-status" role="status"></p>
      </section>
    </div>
    <section id="recordView" class="record-view section-wrap" hidden aria-labelledby="recordTitle"></section>
  </main>
  <footer class="site-footer"><span>全知教会见证处 © 2026</span><span>HM 归档服务办公室</span></footer>
  <dialog id="photoViewer" aria-labelledby="photoCaption"><div class="photo-toolbar"><p id="photoCaption"></p><button id="photoClose" type="button" aria-label="关闭照片">关闭 ×</button></div><img id="photoLarge" alt=""></dialog>
</body>
</html>
