<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主线章节 · 报刊背景素材</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ede9e0;color:#353b32;font:14px/1.6 system-ui,sans-serif}header{padding:25px 30px;border-bottom:1px solid #c7c5b8;background:#f9f6ee}header small{font-size:11px;letter-spacing:.14em;color:#77816c}h1{font:30px/1.5 "Songti SC",serif;margin:5px 0}header p{margin:0;color:#767c6d}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 150px)}aside{padding:22px;border-right:1px solid #cbc8bc;background:#f8f4eb}h2{font-size:14px;margin:0 0 12px;font-weight:600}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}.choices button{padding:5px;background:#efeadf;border:1px solid #c9c7bb;cursor:pointer;color:#52594a;font:11px/1.6 system-ui}.choices button[aria-pressed="true"]{border:2px solid #587054;padding:4px;background:#e3e8d8}.choices img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#ddd8c8}.choices span{display:block;margin-top:5px}.field{display:grid;gap:6px;margin:14px 0}.field>span{font-size:12px;color:#6e7862}input[type="text"],textarea,select{width:100%;padding:9px;border:1px solid #b9c0a9;background:#fffdf6;color:#333c30;border-radius:0;font:14px/1.6 system-ui}textarea{height:170px;resize:vertical}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;margin:18px 0}input[type="range"]{width:100%;accent-color:#587054}.downloads{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.downloads a{display:block;padding:9px 12px;background:#455a41;color:white;text-decoration:none;font-size:12px}.meta{font-size:11px;color:#838875;word-break:break-all}.stage{padding:30px;min-width:0;display:flex;flex-direction:column;align-items:center}.stage>p{margin:0 0 18px;font-size:12px;color:#6c7760}.paper{width:min(100%,650px);position:relative;container-type:inline-size;box-shadow:0 16px 45px #2b321c26;background:#e5decc}.paper>img{display:block;width:100%;height:auto}.paper-title,.paper-body{position:absolute;overflow:hidden;color:#232921;font-family:"Songti SC","STSong",serif;overflow-wrap:anywhere}.paper-title{display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;font-weight:700;line-height:1.2;margin:0}.paper-body{font-size:var(--body-size,3.1cqw);line-height:1.85;white-space:pre-wrap;text-align:justify}.paper-body.columns{column-count:2;column-gap:6cqw;column-rule:1px solid #48493440}.paper.show-guides .paper-body{outline:1px dashed #729567}.paper.show-guides .paper-title{outline:1px dashed #729567}#overflow{max-width:650px;width:100%;margin-top:15px;color:#9c5739;font-size:12px}#body-fit{font-size:11px;line-height:1.8;color:#89927e}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #587054;outline-offset:3px}@media(max-width:900px){.layout{grid-template-columns:285px minmax(0,1fr)}aside{padding:16px}.stage{padding:20px}}@media(max-width:650px){header{padding:18px}.layout{display:flex;flex-direction:column}aside{border:0}.choices{grid-template-columns:repeat(5,1fr)}.choices button{font-size:10px}.stage{padding:18px}.options{grid-template-columns:1fr 1fr}}
[hidden]{display:none!important}
</style></head><body>
<header><small>《我要找到你》 · 作者素材预览</small><h1>主线章节报刊背景</h1><p>背景图片不含文字。可输入文稿查看叠加效果，再下载所选背景。</p></header>
<main class="layout"><aside><h2>选择背景 · 9 张</h2><nav id="choices" class="choices" aria-label="章节背景"></nav>
<label class="field"><span>文稿标题</span><input id="title" type="text" value="文稿标题"></label>
<label class="field"><span>文稿正文</span><textarea id="copy">这里是一段排版预览文字。

你可以输入自己的文稿，查看它在报纸或报刊背景上的呈现效果。背景只保留纸张纹理、边缘和报头横线，正文区域保持空白。

章节资料、人物姓名和具体内容由你后续填写。</textarea></label>
<div class="options"><label class="field"><span>正文排版</span><select id="columns"><option value="1">单栏</option><option value="2">双栏</option></select></label><label class="field"><span>正文大小 <output id="size-label">20</output></span><input id="size" type="range" min="14" max="28" value="20"></label></div>
<label class="field"><span>标题大小 <output id="title-size-label">30</output></span><input id="title-size" type="range" min="18" max="42" value="30"></label>
<div class="checks"><label><input id="show-copy" type="checkbox" checked> 显示文稿</label><label><input id="guides" type="checkbox"> 显示排版区域</label></div>
<div class="downloads"><a id="download-png" download>下载 PNG 原图</a><a id="download-webp" download>下载网页用图</a></div><p id="meta" class="meta"></p><p id="body-fit">此页用于素材试排，预览文稿不会写入游戏内容。</p>
</aside><section class="stage"><p id="selected-name"></p><article class="paper" id="paper"><img id="background" alt="空白报刊背景"><h2 class="paper-title" id="preview-title"></h2><div class="paper-body" id="preview-body"></div></article><p id="overflow" role="status"></p></section></main>
<script src="manifest.js"></script><script>
(() => {
const $=s=>document.querySelector(s),items=window.ChapterPapers;let current=items[0];
const choices=$('#choices'),paper=$('#paper'),title=$('#preview-title'),body=$('#preview-body');
function box(node,rect){Object.assign(node.style,{left:rect.x*100+'%',top:rect.y*100+'%',width:rect.width*100+'%',height:rect.height*100+'%'});}
function fit(){if(!$('#show-copy').checked){$('#overflow').textContent='';return;}const excess=body.scrollHeight>body.clientHeight+2||body.scrollWidth>body.clientWidth+2||title.scrollHeight>title.clientHeight+2;$('#overflow').textContent=excess?'文稿已超出当前版面，可减小字号或分成多页。':'';}
function render(){title.textContent=$('#title').value;body.textContent=$('#copy').value;title.hidden=body.hidden=!$('#show-copy').checked;body.classList.toggle('columns',$('#columns').value==='2');paper.classList.toggle('show-guides',$('#guides').checked);title.style.fontSize=Number($('#title-size').value)/6.5+'cqw';body.style.fontSize=Number($('#size').value)/6.5+'cqw';$('#size-label').textContent=$('#size').value;$('#title-size-label').textContent=$('#title-size').value;requestAnimationFrame(fit);}
function select(item){current=item;$('#background').src=item.src;$('#background').alt=item.chapter+' · '+item.name+'空白背景';box(title,item.titleRect);box(body,item.bodyRect);$('#selected-name').textContent=item.chapter+' · '+item.name;$('#download-png').href=item.png;$('#download-webp').href=item.src;$('#meta').textContent=item.src;for(const b of choices.children)b.setAttribute('aria-pressed',String(b.dataset.id===item.id));history.replaceState(null,'','#'+item.id);render();}
for(const item of items){const b=document.createElement('button');b.type='button';b.dataset.id=item.id;b.setAttribute('aria-label',item.chapter+' '+item.name);const img=document.createElement('img');img.src=item.src;img.alt='';img.loading='lazy';const label=document.createElement('span');label.textContent=item.chapter;b.append(img,label);b.onclick=()=>select(item);choices.append(b);}
for(const id of ['title','copy','columns','size','title-size','show-copy','guides'])$('#'+id).addEventListener('input',render);
$('#background').addEventListener('load',fit);window.addEventListener('resize',fit);window.addEventListener('hashchange',()=>{const item=items.find(i=>i.id===location.hash.slice(1));if(item&&item!==current)select(item);});
select(items.find(i=>i.id===location.hash.slice(1))||items[0]);
})();
</script></body></html>
